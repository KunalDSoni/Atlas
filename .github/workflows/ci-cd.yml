# ===== Atlas CI/CD Pipeline =====
# Runs tests on push to main and on PRs.
# Deploys are handled by Render's GitHub auto-deploy (not this workflow).

name: Atlas CI/CD

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    name: Test
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: |
            backend/package-lock.json
            frontend/package-lock.json

      - name: Install dependencies
        working-directory: backend
        run: npm ci

      - name: Run backend tests
        working-directory: backend
        run: npm run test:backend

      # Named "frontend tests" but it runs backend/tests/frontend, whose single
      # file asserts the built artifacts exist and SKIPS when they do not. This
      # job never builds, so every one of those tests skipped and the step
      # reported green while checking nothing.
      - name: Check built SPA artifacts (skips when not built)
        working-directory: backend
        run: npm run test:frontend

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      # The real frontend unit tests. These run under vitest, which until now no
      # workflow invoked at all — 35 tests across four files existed, passed
      # locally, and protected nothing on main.
      - name: Run frontend unit tests
        working-directory: frontend
        run: npx vitest run

  # The jest suites never render the app. The zero-project regression documented
  # in KNOWN-ISSUES.md — a fresh deployment with no way to create its first
  # project — was invisible to every check above and only showed up in
  # production. These two Playwright suites drive the real built SPA against the
  # real backend, and `e2e:empty` is the only one that sees an unseeded install.
  e2e:
    name: E2E (browser)
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: |
            backend/package-lock.json
            frontend/package-lock.json

      - name: Install backend dependencies
        working-directory: backend
        run: npm ci

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: Install Chromium
        working-directory: frontend
        run: npx playwright install --with-deps chromium

      # Build from source so the suites exercise the current tree, not whatever
      # frontend/build/ happens to be committed.
      - name: Build frontend
        working-directory: frontend
        run: npm run build

      - name: Run E2E suite (seeded)
        working-directory: frontend
        run: npm run test:e2e

      - name: Run E2E suite (fresh install, no seed data)
        working-directory: frontend
        run: npm run test:e2e:empty

      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-failures
          path: frontend/test-results/
          retention-days: 7

  # Mobile had no automated check of any kind: no tests, no typecheck, no build.
  # That is how src/api/hooks.ts came to import an `apiClient` that client.ts
  # does not export — 39 call sites, throwing on first use — and call endpoints
  # (GET /issues, /sprints, /filters) that the backend does not serve, while
  # eight registered screens depend on it.
  #
  # Only the jest suite is a gate here. `npm run typecheck` is deliberately NOT
  # wired in yet: it currently fails, and a step that is always red is a step
  # everyone learns to ignore. Turn it into a gate in the same change that
  # fixes those errors.
  mobile:
    name: Mobile (unit)
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: mobile/package-lock.json

      - name: Install dependencies
        working-directory: mobile
        run: npm ci

      - name: Run mobile tests
        working-directory: mobile
        run: npm test -- --ci

  # The main suite runs on sql.js, so migrations.js's MySQL branch would ship
  # untested — and a MySQL-only migration bug crashes production on boot rather
  # than failing a test. This job exercises it against a real server.
  mysql-migrations:
    name: MySQL migrations
    runs-on: ubuntu-latest

    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_ROOT_PASSWORD: testpw
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h localhost -ptestpw"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: backend/package-lock.json

      - name: Install dependencies
        working-directory: backend
        run: npm ci

      - name: Run migration tests against MySQL
        working-directory: backend
        env:
          MYSQL_TEST_HOST: 127.0.0.1
          MYSQL_TEST_PORT: 3306
          MYSQL_TEST_USER: root
          MYSQL_TEST_PASSWORD: testpw
        run: npx jest tests/backend/mysql-migrations.test.js --runInBand --forceExit
