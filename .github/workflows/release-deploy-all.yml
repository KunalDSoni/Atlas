# Roll one release out to every customer, automatically.
#
# Chained to the image build rather than to the push: you cannot deploy an image
# that does not exist yet, and the build is the step that proves the release is
# real. So the sequence is
#
#   push to main -> release-version.yml tags it -> release-build.yml builds it
#                -> this workflow deploys it to every customer
#
# ONE CUSTOMER AT A TIME, AND IT STOPS ON FAILURE. `max-parallel: 1` with the
# default fail-fast means customer two is never touched if customer one's smoke
# test fails. That keeps the property the manual workflow was built around — a
# bad release caught on the first customer never reaches the rest — while still
# requiring nobody to press a button. What it gives up is the human who used to
# look at the first customer before continuing; the readiness probe stands in
# for that judgement, so it is worth keeping honest.
#
# The order below is deliberate: least to most sensitive, so the smallest
# customer is the one that finds a bad release.
#
# To roll back, run *Release - deploy one customer* with the previous tag. That
# workflow is the same steps as this one calls, so a rollback behaves exactly
# like a deploy.
name: Release - deploy every customer

on:
  workflow_run:
    workflows: ["Release - build image"]
    types: [completed]

# Never let two rollouts overlap. Without this, two releases landing minutes
# apart could deploy to the same customer at once and race on the task
# definition revision.
concurrency:
  group: release-deploy-all
  cancel-in-progress: false

permissions:
  contents: read
  id-token: write

jobs:
  # workflow_run fires on every completion, success or not. Deploying the
  # output of a failed build would be deploying an image that was never pushed.
  guard:
    name: Should we roll out?
    runs-on: ubuntu-latest
    if: github.event.workflow_run.conclusion == 'success'
    outputs:
      version: ${{ steps.check.outputs.version }}
      rollout: ${{ steps.check.outputs.rollout }}
    steps:
      - id: check
        env:
          # For a tag-triggered run this is the tag name, e.g. v14.2.1.
          HEAD_BRANCH: ${{ github.event.workflow_run.head_branch }}
        run: |
          set -euo pipefail
          if [[ "$HEAD_BRANCH" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "Rolling out $HEAD_BRANCH to every customer."
            echo "version=$HEAD_BRANCH" >> "$GITHUB_OUTPUT"
            echo "rollout=true" >> "$GITHUB_OUTPUT"
          else
            echo "Build was for '$HEAD_BRANCH', which is not a release tag. Nothing to roll out."
            echo "rollout=false" >> "$GITHUB_OUTPUT"
          fi

  deploy:
    name: ${{ matrix.customer }}
    needs: guard
    if: needs.guard.outputs.rollout == 'true'
    strategy:
      # Sequential and fail-fast: the whole point. A failed smoke test must stop
      # the rollout, not race three customers into the same bad version.
      max-parallel: 1
      fail-fast: true
      matrix:
        customer: [accesspoint, diligence, modernharvest]
    uses: ./.github/workflows/release-deploy.yml
    permissions:
      contents: read
      id-token: write # OIDC, scoped per customer by the called job's environment
    with:
      customer: ${{ matrix.customer }}
      version: ${{ needs.guard.outputs.version }}

  report:
    name: Rollout summary
    needs: [guard, deploy]
    if: always() && needs.guard.outputs.rollout == 'true'
    runs-on: ubuntu-latest
    steps:
      - run: |
          {
            echo "### Rollout of ${{ needs.guard.outputs.version }}"
            echo ""
            if [ "${{ needs.deploy.result }}" = "success" ]; then
              echo "✅ Every customer is on \`${{ needs.guard.outputs.version }}\`."
            else
              echo "❌ **The rollout stopped early.** Customers deployed before the failure are on"
              echo "\`${{ needs.guard.outputs.version }}\`; the rest are still on the previous version."
              echo ""
              echo "Check the matrix above for which customer failed, then either fix forward or roll"
              echo "back the ones already moved with *Release - deploy one customer*."
            fi
          } >> "$GITHUB_STEP_SUMMARY"
