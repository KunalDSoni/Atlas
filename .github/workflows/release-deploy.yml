# Deploy one already-built image to one customer.
#
# Manual dispatch only. One customer per run, verified in between, so a bad
# release caught on the first customer never reaches the second. Customers
# briefly running different versions is a property of the silo model, not a fault.
#
# The `environment:` below serves two purposes. It scopes the OIDC subject, so
# the AWS role issues credentials for one customer's environment only. And once
# the repo admin adds required reviewers, a deploy needs an explicit approval.
#
# NOTE: environment protection rules (required reviewers, wait timers) are free
# on public repos but need GitHub Pro/Team/Enterprise on private ones. Without
# them the `environment:` key still works - deployment history and OIDC scoping
# are unaffected - there is simply no approval gate, and the protection is then
# the private repo plus manual dispatch plus the scoped trust policy.
name: Release - deploy one customer

on:
  workflow_dispatch:
    inputs:
      customer:
        description: Which customer to deploy to
        required: true
        type: choice
        options: [accesspoint, diligence, modernharvest]
      version:
        description: Image tag to deploy (e.g. v3). Must already exist in ECR.
        required: true
        type: string
  # Called once per customer by release-deploy-all.yml. The steps below are
  # identical either way, so the automated rollout and a hand-run rollback
  # cannot drift apart.
  workflow_call:
    inputs:
      customer:
        required: true
        type: string
      version:
        required: true
        type: string

permissions:
  contents: read
  id-token: write

env:
  AWS_REGION: ap-south-1
  ECR_REPOSITORY: 452456948941.dkr.ecr.ap-south-1.amazonaws.com/atlas
  ECS_CLUSTER: atlas

jobs:
  deploy:
    name: Deploy ${{ inputs.version }} to ${{ inputs.customer }}
    runs-on: ubuntu-latest
    environment: ${{ inputs.customer }}
    steps:
      - name: Configure AWS credentials (OIDC, no stored secrets)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::452456948941:role/atlasGitHubDeployRole
          aws-region: ${{ env.AWS_REGION }}

      - name: Verify the image exists before touching anything
        run: |
          set -euo pipefail
          aws ecr describe-images --repository-name atlas \
            --image-ids imageTag="${{ inputs.version }}" >/dev/null
          echo "Image ${{ inputs.version }} found."

      - name: Build the new task definition revision
        id: taskdef
        run: |
          set -euo pipefail
          FAMILY="atlas-${{ inputs.customer }}"

          aws ecs describe-task-definition --task-definition "$FAMILY" \
            --query taskDefinition > current.json

          # Strip the read-only fields AWS returns but will not accept back,
          # point at the new image, and drop the first-boot admin bootstrap
          # variables. ADMIN_* is only read when the users table is empty
          # (backend/database.js), so after the first deploy it is dead weight -
          # and it sits in plaintext in every revision forever. Removing it here
          # means the hardening happens automatically and stays done.
          jq --arg img "${ECR_REPOSITORY}:${{ inputs.version }}" '
            del(.taskDefinitionArn, .revision, .status, .requiresAttributes,
                .compatibilities, .registeredAt, .registeredBy, .deregisteredAt)
            | .containerDefinitions[0].image = $img
            | .containerDefinitions[0].environment |=
                map(select(.name | startswith("ADMIN_") | not))
          ' current.json > next.json

          REVISION=$(aws ecs register-task-definition --cli-input-json file://next.json \
            --query 'taskDefinition.revision' --output text)
          echo "revision=$REVISION" >> "$GITHUB_OUTPUT"
          echo "Registered ${FAMILY}:${REVISION}"

      - name: Update the service
        run: |
          set -euo pipefail
          aws ecs update-service \
            --cluster "$ECS_CLUSTER" \
            --service "${{ inputs.customer }}" \
            --task-definition "atlas-${{ inputs.customer }}:${{ steps.taskdef.outputs.revision }}" \
            >/dev/null
          echo "Service updated. ECS keeps the old task serving until the new one is healthy."

      - name: Wait for the deployment to stabilise
        # Fails the run if the new task never becomes healthy. The old task keeps
        # serving in that case - a failed deploy is not an outage.
        run: |
          set -euo pipefail
          aws ecs wait services-stable --cluster "$ECS_CLUSTER" --services "${{ inputs.customer }}"
          echo "Deployment stable."

      - name: Smoke-test the live endpoint
        run: |
          set -euo pipefail
          URL="https://${{ inputs.customer }}.open-atlas.xyz/api/health/ready"
          for i in $(seq 1 10); do
            CODE=$(curl -s -o /dev/null -w '%{http_code}' --max-time 15 "$URL" || true)
            if [ "$CODE" = "200" ]; then echo "$URL -> 200"; exit 0; fi
            echo "attempt $i: $CODE"; sleep 10
          done
          echo "Readiness never returned 200 - investigate before deploying the next customer."
          exit 1

      - name: Summary
        if: always()
        run: |
          {
            echo "### ${{ inputs.customer }} -> ${{ inputs.version }}"
            echo ""
            echo "Task definition: \`atlas-${{ inputs.customer }}:${{ steps.taskdef.outputs.revision }}\`"
            echo "URL: https://${{ inputs.customer }}.open-atlas.xyz"
            echo ""
            echo "**Check it by hand before deploying the next customer** - log in and click around."
            echo "To roll back, run this workflow again with the previous version tag."
          } >> "$GITHUB_STEP_SUMMARY"
